name: Build Image

# Calls the shared Docker build workflow in jcwearn/workflows, replacing a local
# copy of the same four steps that world-clock and ansible-runner also carried,
# and that release.yaml's build job carried a fourth time.
#
# Builds without pushing: with no `image` input the shared workflow skips the
# registry login entirely, so this needs no credentials and no packages scope.
# Pushing stays release.yml's job, which reaches the same shared workflow
# through release.yaml with an `image` set -- so the PR path and the release
# path are one implementation rather than two that happened to agree.
#
# The `test` job that used to live here moved to ci.yml, which calls the shared
# Python CI workflow. With the build now delegated too, this file is a single
# call and nothing else, which matches its name.

on:
  pull_request:
    branches: [main]

jobs:
  build:
    # Explicit even though `read` is all this needs and all the account grants
    # by default. A reusable workflow can only narrow what the caller granted,
    # so the grant belongs here where it is visible. `packages: write` is
    # deliberately absent: nothing is pushed from a pull request.
    permissions:
      contents: read
    # Renovate pins this to a digest on its next run, leaving `# v1` behind as
    # the record of what to follow. Written as `@v1` with no trailing comment;
    # the comment belongs on a digest, where it records which tag it came from.
    uses: jcwearn/workflows/.github/workflows/docker-build.yaml@6dee2c5b6750693d138941a82d42d5493b4b0fc8 # v1
