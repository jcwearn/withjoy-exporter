name: Build Image

# Builds the container on a pull request without pushing it, so a Dockerfile or
# dependency change that breaks the image is caught before merge rather than
# during a release.
#
# The `test` job that used to live here moved to ci.yml, which calls the shared
# Python CI workflow. It was worth moving rather than copying: it hardcoded
# python-version: "3.14" while this Dockerfile's base image ships 3.12.3, so it
# had been testing an interpreter the container never runs. The replacement
# reads .python-version, and adds the lint and format checks this repo never
# had.
#
# This workflow now does one thing, which matches its name.

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
