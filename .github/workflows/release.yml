name: Release

# Calls the shared release workflow in jcwearn/workflows, replacing a
# hand-rolled copy that had drifted from ansible-runner's copy of the same
# idea. One implementation now, so a fix lands in both places at once.
#
# The property that matters: publish runs after build, inside the reusable
# workflow, so nothing is tagged until the image it names exists. ansible-runner
# v0.1.29-v0.1.35 are what the other ordering produces -- seven tags and
# Releases with no image behind them, unnoticed for a month.
#
# move-major-tag is left off (the default). This repo's artifact is the
# container image and consumers pin image tags, so a moving git tag would be
# created and never read. The moving IMAGE tags are unaffected.

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true
    # Both scopes are required, and packages: write is not optional just
    # because the build might be skipped: nested-job permissions are validated
    # statically, before any `if:` runs. Omitting it makes the workflow fail to
    # parse rather than fail at the push.
    permissions:
      contents: write # git tag + GitHub Release
      packages: write # push to GHCR
    uses: jcwearn/workflows/.github/workflows/release.yaml@6dee2c5b6750693d138941a82d42d5493b4b0fc8 # v1
    with:
      image: ghcr.io/jcwearn/withjoy-exporter
      # Docker convention is no prefix, and ansible-runner publishes bare
      # 0.1.36. This repo has always published vX.Y.Z, and k3s-cluster pins
      # `:v0.4.1@sha256:...` by string in both deployment.yaml and cronjob.yaml.
      # Dropping the v would leave Renovate with nothing matching to upgrade --
      # it would stall silently rather than fail. A compatibility shim; drop it
      # only if those two pins are rewritten at the same time.
      image-tag-prefix: "v"
